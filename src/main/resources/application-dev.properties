# === DataSource ===
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cbkt}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# >>> Define o schema padrão para todas as entidades <<<
spring.jpa.properties.hibernate.default_schema=cadastro
# === JPA/Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.data.jpa.repositories.escape-character=\

# === Performance e Connection Pool ===
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JWT 
app.jwt.secret=${JWT_SECRET:MyJwtSecretKey}
app.jwt.expiration-seconds=7200

# Logging - Produção
logging.level.org.springframework=WARN
logging.level.br.dev.mmc=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Error handling
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Actuator para health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Em produção, mata tudo sem dó
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true