# Configuração de Produção para Docker
spring.application.name=cbkt-api-cadastro

# Porta do servidor (deve corresponder ao EXPOSE no Dockerfile)
server.port=8081

# === DataSource ===
spring.datasource.url=jdbc:postgresql://postgres:5432/cbkt
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# >>> Define o schema padrão para todas as entidades <<<
spring.jpa.properties.hibernate.default_schema=cadastro

# === JPA/Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# === Performance e Connection Pool ===
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JWT 
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=7200

# Logging - Produção
logging.level.org.springframework=WARN
logging.level.br.dev.mmc=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Error handling
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

#Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=marcelocaires@mmc.dev.br
spring.mail.password=pjnslayujvprtutx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Actuator para health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Acessando propriedades padrão do Maven
info.app.name=${project.name}
info.app.version=${project.version}
info.app.groupId=${project.groupId}

# Exemplo de uso em uma mensagem de log formatada
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%project.version] %msg%n