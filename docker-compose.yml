services:
  cbkt-api:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: cbkt-api-cadastro
    image: cbkt-api-cadastro
    restart: unless-stopped
    ports:
      - 8081:8081
    networks:
      - web
    labels:
      - "traefik.enable=true"
      # Router para o prefixo /api/cadastro/
      - "traefik.http.routers.cadastro.rule=Host(`cbkt.mmc.dev.br`) && PathPrefix(`/api/cadastro`)"
      - "traefik.http.routers.cadastro.entrypoints=websecure"
      - "traefik.http.routers.cadastro.tls.certresolver=letsencrypt"
      # Remove o prefixo /api/cadastro/
      - "traefik.http.middlewares.cadastro-stripprefix.stripprefix.prefixes=/api/cadastro"
      # Aplica o middleware de remoção de prefixo
      - "traefik.http.routers.cadastro.middlewares=cadastro-stripprefix@docker"
      # Serviço de destino
      - "traefik.http.services.cadastro.loadbalancer.server.port=8081"
    environment:
      # Profile do Spring
      - SPRING_PROFILES_ACTIVE=prod
      # Configurações do banco (devem ser fornecidas externamente)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://cbkt.mmc.dev.br/api/cadastro/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
networks:
  web:
    external: true