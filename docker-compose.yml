version: '3.8'

services:
  # Aplicação CBKT Cadastro
  cbkt-api:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: cadastro
    restart: unless-stopped
    ports:
      - ${API_PORT:-8080}:${API_PORT:-8080}
    network_mode: host
    environment:
      # Profile do Spring
      - SPRING_PROFILES_ACTIVE=prod
      # Configurações do banco (devem ser fornecidas externamente)
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-cbkt}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
