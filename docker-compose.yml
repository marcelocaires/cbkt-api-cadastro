version: '3.8'

services:
  # Base de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: cbkt-postgres-cadastro
    restart: unless-stopped
    environment:
      POSTGRES_DB: cbkt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cbkt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicação CBKT Cadastro
  cbkt-api-cadastro:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: cbkt-api-cadastro
    restart: unless-stopped
    ports:
      - '8082:8080'
    environment:
      # Profile do Spring
      - SPRING_PROFILES_ACTIVE=prod
      # Configurações do banco
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cbkt
      - DB_USER=postgres
      - DB_PASS=postgres
      # JWT
      - JWT_SECRET=MySecureJwtSecretKeyForProduction2024!
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cbkt-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  cbkt-network:
    driver: bridge
